<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Planner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap');

  :root{
    --bg-top:#FFF1F6;
    --bg-bottom:#FFF8EE;
    --card:#FFFFFF;
    --ink:#3A2233;
    --muted:#9C7E92;
    --line:#F6E3ED;
    --pink:#F0407A;
    --pink-dark:#C22A5E;
    --pink-tint:#FDE4ED;
    --pink-deep:#3A0F27;
    --violet:#8A5FCF;
    --violet-dark:#5F3EA0;
    --violet-tint:#EEE6FA;
    --teal:#1EA88F;
    --teal-dark:#137A66;
    --teal-tint:#DFF5F1;
    --green:#39B383;
    --green-dark:#22855F;
    --green-tint:#DEF6EB;
    --amber:#F0A63C;
    --amber-dark:#C77D14;
    --amber-tint:#FCEED9;
    --plum:#9A5FC2;
    --plum-dark:#6E3E96;
    --plum-tint:#F1E6FA;
    --sky:#3CA9D6;
    --sky-dark:#217CA3;
    --sky-tint:#DFF3FB;
    --shadow: 0 2px 4px rgba(58,15,39,0.04), 0 10px 24px -14px rgba(58,15,39,0.18);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 55%);
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }

  .phone{ width:100%; max-width:460px; }

  .back-link{ display:inline-block; margin-bottom:16px; font-size:13px; font-weight:700; color:var(--muted); text-decoration:none; }
  .back-link:hover{ color:var(--pink-dark); }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--pink-tint);
    color:var(--pink-dark);
    font-weight:700;
    font-size:12.5px;
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:12px;
  }

  h1.title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:34px;
    letter-spacing:-0.01em;
    margin:0 0 6px;
    color:var(--pink);
  }

  .subtitle{ color:var(--muted); font-size:14px; margin:0 0 22px; font-weight:600; }

  .section-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:18px;
    color:var(--pink-deep);
    margin:0 0 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .week-nav{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--muted); font-weight:700; }
  .week-nav button{
    border:none; background:var(--pink-tint); color:var(--pink-dark); width:26px; height:26px;
    border-radius:50%; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center;
  }

  .day-card{
    background:var(--card);
    border-radius:18px;
    padding:14px 16px;
    box-shadow:var(--shadow);
    margin-bottom:10px;
  }
  .day-label{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px; margin-bottom:8px; color:var(--pink-dark); }
  .day-label .date-sub{ font-family:'Nunito',sans-serif; font-weight:600; font-size:11.5px; color:var(--muted); margin-left:6px; }
  .meal-row{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .meal-row:last-child{ margin-bottom:0; }
  .meal-tag{
    font-size:10.5px; font-weight:700; color:var(--muted); width:64px; flex-shrink:0;
  }
  .meal-input{
    flex:1; border:1.5px solid var(--line); border-radius:10px; padding:8px 10px;
    font-size:13px; font-family:'Nunito',sans-serif; font-weight:600; background:#FFFBFD;
  }
  .meal-input:focus{ outline:none; border-color:var(--pink); }

  .grocery-section{ margin-top:28px; }

  .add-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--pink);
    color:white;
    font-weight:700;
    font-size:13.5px;
    border:none;
    border-radius:999px;
    padding:11px 20px;
    cursor:pointer;
    box-shadow:0 6px 16px -6px rgba(240,64,122,0.55);
    margin-bottom:18px;
    width:100%;
    justify-content:center;
  }
  .add-btn:hover{ background:var(--pink-dark); }

  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--muted);
    font-weight:700;
    font-size:14px;
  }

  .item-list{ display:flex; flex-direction:column; gap:8px; }
  .group-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13.5px;
    margin:14px 0 2px;
  }
  .group-label:first-child{ margin-top:0; }
  .group-label.produce{ color:var(--green-dark); }
  .group-label.dairy{ color:var(--sky-dark); }
  .group-label.meat{ color:var(--pink-dark); }
  .group-label.pantry{ color:var(--amber-dark); }
  .group-label.frozen{ color:var(--violet-dark); }
  .group-label.other{ color:var(--plum-dark); }

  .item-row{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border-radius:14px;
    padding:10px 12px;
    box-shadow:var(--shadow);
  }
  .item-row.got{ opacity:0.55; }
  .item-check{ width:19px; height:19px; flex-shrink:0; cursor:pointer; accent-color:var(--pink); }
  .item-name{ flex:1; font-weight:700; font-size:13.5px; }
  .item-name.got{ text-decoration:line-through; }
  .item-del{ border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:16px; padding:2px 4px; }
  .item-del:hover{ color:#C43A3A; }

  .add-row{ display:flex; gap:8px; margin-bottom:14px; }
  .add-row select, .add-row input{
    border:1.5px solid var(--line); border-radius:12px; padding:10px 12px;
    font-size:13.5px; font-family:'Nunito',sans-serif; font-weight:600; background:#FFFBFD;
  }
  .add-row select{ flex:0 0 108px; }
  .add-row input{ flex:1; }
  .add-row button{
    border:none; background:var(--pink); color:white; border-radius:12px; padding:0 16px;
    font-weight:700; font-size:13px; cursor:pointer;
  }
  .add-row button:hover{ background:var(--pink-dark); }
</style>
</head>
<body>

<div class="phone">
  <a class="back-link" href="index.html">&larr; All lists</a>
  <div class="eyebrow">🍽️ what's for dinner 🍽️</div>
  <h1 class="title">Meal planner ✨</h1>
  <p class="subtitle">This week's menu and the grocery run to match.</p>

  <div class="section-title">
    <span>This week</span>
    <div class="week-nav">
      <button id="prevWeekBtn">‹</button>
      <span id="weekRangeLabel"></span>
      <button id="nextWeekBtn">›</button>
    </div>
  </div>

  <div id="weekGrid"></div>

  <div class="grocery-section">
    <div class="section-title"><span>Grocery list</span></div>

    <div class="add-row">
      <select id="groceryCategory">
        <option value="produce">🥬 Produce</option>
        <option value="dairy">🥛 Dairy</option>
        <option value="meat">🍗 Meat</option>
        <option value="pantry">🥫 Pantry</option>
        <option value="frozen">🧊 Frozen</option>
        <option value="other">🛒 Other</option>
      </select>
      <input type="text" placeholder="Add an item..." id="groceryInput">
      <button id="groceryAddBtn">Add</button>
    </div>

    <div id="groceryListWrap"></div>
  </div>
</div>

<script src="sync.js"></script>
<script>
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const MEALS = [
  { key:"breakfast", label:"Breakfast" },
  { key:"lunch",     label:"Lunch" },
  { key:"dinner",    label:"Dinner" },
];

const GROCERY_CATEGORIES = {
  produce: { label:"Produce", emoji:"🥬" },
  dairy:   { label:"Dairy",   emoji:"🥛" },
  meat:    { label:"Meat",    emoji:"🍗" },
  pantry:  { label:"Pantry",  emoji:"🥫" },
  frozen:  { label:"Frozen",  emoji:"🧊" },
  other:   { label:"Other",   emoji:"🛒" },
};

let weekOffset = 0;
let menus = {};
let groceries = [];

const STORAGE_KEY = "meal-planner-state";
function loadState(raw){
  try {
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved.menus) menus = saved.menus;
    if (Array.isArray(saved.groceries)) groceries = saved.groceries;
  } catch (e) {
    console.error("Could not load saved data", e);
  }
}
loadState(localStorage.getItem(STORAGE_KEY));

function saveState(){
  try {
    const json = JSON.stringify({ menus, groceries });
    localStorage.setItem(STORAGE_KEY, json);
    if (window.MadiSync) MadiSync.push(STORAGE_KEY, json);
  } catch (e) {
    console.error("Could not save data", e);
  }
}

function getMonday(offset){
  const d = new Date();
  const day = (d.getDay() + 6) % 7;
  const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - day + offset * 7);
  return monday;
}

function formatShortDate(d){
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function weekKey(monday){
  return monday.toISOString().slice(0,10);
}

function renderWeekGrid(){
  const monday = getMonday(weekOffset);
  const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
  document.getElementById("weekRangeLabel").textContent = formatShortDate(monday) + " – " + formatShortDate(sunday);

  const wk = weekKey(monday);
  if (!menus[wk]) menus[wk] = {};

  const grid = document.getElementById("weekGrid");
  grid.innerHTML = "";

  DAYS.forEach((dayName, i) => {
    const dayDate = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
    const dayKey = dayName.toLowerCase();
    if (!menus[wk][dayKey]) menus[wk][dayKey] = {};

    const card = document.createElement("div");
    card.className = "day-card";
    card.innerHTML = `<div class="day-label">${dayName}<span class="date-sub">${formatShortDate(dayDate)}</span></div>`;

    MEALS.forEach(meal => {
      const row = document.createElement("div");
      row.className = "meal-row";
      const tag = document.createElement("div");
      tag.className = "meal-tag";
      tag.textContent = meal.label;
      const input = document.createElement("input");
      input.className = "meal-input";
      input.type = "text";
      input.placeholder = "—";
      input.value = menus[wk][dayKey][meal.key] || "";
      input.addEventListener("change", () => {
        menus[wk][dayKey][meal.key] = input.value.trim();
        saveState();
      });
      row.appendChild(tag);
      row.appendChild(input);
      card.appendChild(row);
    });

    grid.appendChild(card);
  });
}

document.getElementById("prevWeekBtn").addEventListener("click", () => { weekOffset--; renderWeekGrid(); });
document.getElementById("nextWeekBtn").addEventListener("click", () => { weekOffset++; renderWeekGrid(); });

function renderGroceryList(){
  const wrap = document.getElementById("groceryListWrap");
  const listEl = document.createElement("div");
  listEl.className = "item-list";
  let totalShown = 0;

  Object.keys(GROCERY_CATEGORIES).forEach(catKey => {
    const catItems = groceries.filter(g => g.category === catKey);
    if (catItems.length === 0) return;
    const label = document.createElement("div");
    label.className = "group-label " + catKey;
    label.textContent = GROCERY_CATEGORIES[catKey].emoji + " " + GROCERY_CATEGORIES[catKey].label;
    listEl.appendChild(label);

    catItems.forEach(item => {
      totalShown++;
      const row = document.createElement("div");
      row.className = "item-row" + (item.got ? " got" : "");

      const check = document.createElement("input");
      check.type = "checkbox";
      check.className = "item-check";
      check.checked = !!item.got;
      check.addEventListener("change", () => {
        item.got = check.checked;
        renderGroceryList();
        saveState();
      });

      const name = document.createElement("div");
      name.className = "item-name" + (item.got ? " got" : "");
      name.textContent = item.name;

      const del = document.createElement("button");
      del.className = "item-del";
      del.textContent = "×";
      del.addEventListener("click", () => {
        groceries = groceries.filter(g => g.id !== item.id);
        renderGroceryList();
        saveState();
      });

      row.appendChild(check);
      row.appendChild(name);
      row.appendChild(del);
      listEl.appendChild(row);
    });
  });

  wrap.innerHTML = "";
  if (totalShown === 0){
    wrap.innerHTML = `<div class="empty-state">Grocery list is empty — add what you need 🛒</div>`;
  } else {
    wrap.appendChild(listEl);
  }
}

document.getElementById("groceryAddBtn").addEventListener("click", () => {
  const category = document.getElementById("groceryCategory").value;
  const input = document.getElementById("groceryInput");
  const name = input.value.trim();
  if (!name) return;
  groceries.unshift({ id: "g_" + Date.now(), name, category, got: false });
  input.value = "";
  renderGroceryList();
  saveState();
});

document.getElementById("groceryInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("groceryAddBtn").click();
});

renderWeekGrid();
renderGroceryList();

if (window.MadiSync) MadiSync.init(STORAGE_KEY, (raw) => { loadState(raw); renderWeekGrid(); renderGroceryList(); });
</script>

</body>
</html>
